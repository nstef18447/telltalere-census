[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telltalere-census"
version = "0.3.0"
description = "Shared Census PUMS / ACS data layer for Telltale RE products."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Telltale Real Estate LLC" }]
license = { text = "Proprietary" }

dependencies = [
    "pandas",
    "requests",
    "pyarrow",
    "platformdirs",
    "shapely",
]

[project.optional-dependencies]
dev = ["pytest"]
geo = ["geopandas"]

[tool.setuptools]
packages = ["telltalere_census"]
include-package-data = true

[tool.setuptools.package-data]
telltalere_census = ["data/*.parquet"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that hit live external APIs (Census). Skipped in fast unit runs.",
]
